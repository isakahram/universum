[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universum"
version = "1.0.0"
description = "Desktop app for teachers: generates styled PDF study materials via free LLM + LaTeX"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Isa Kahram" }]
dependencies = [
    "customtkinter>=5.2.2",
    "pypdf>=4.0,<6.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "Pillow>=10.0",
    "pytesseract>=0.3.13",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
universum = "universum.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
